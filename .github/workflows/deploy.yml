name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for executable teaching checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned teaching test tools
        run: python -m pip install -r examples/stage-1-pytest/requirements.txt -r examples/stage-1-typing-tools/requirements.txt

      - name: Verify teaching test tools are available
        run: python -c "import pytest, coverage, mypy, pydantic"

      - name: Install dependencies
        run: npm ci

      - name: Run regression and routing checks
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Copy index.html to 404.html for GitHub Pages fallback
        run: cp dist/index.html dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
